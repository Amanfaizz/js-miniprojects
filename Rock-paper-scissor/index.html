<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css"> 





</head>

<body>

    
    <p class="title">This is Rock Papers Scissors</p>
    <div class='container'>
    <button onclick="
    playGame('Rock');
    " class="btn-prop"><img src="images/rock-emoji.png" class="icon-prop"></button>

    <button onclick="
    playGame('Paper');
    " class="btn-prop"><img src="images/paper-emoji.png" class="icon-prop"></button>

    <button onclick="
    playGame('Scissor');
    " class="btn-prop"><img src="images/scissors-emoji.png" class="icon-prop"></button>


    <p class="js-score"></p>

    <p class="js-result"></p>
    <button onclick="
    reset();
     " class="btn">Reset</button>
    </div>

   





    <script src="script.js"> </script>
